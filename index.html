<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Your personal command center for AI tools.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brain Hub">
  <title>Brain Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="core/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home">Brain Hub</a>
    <nav class="topnav" aria-label="Main">
      <a href="#/home" data-nav="home" data-testid="nav-home">Home</a>
      <a href="#/settings" data-nav="settings" data-testid="nav-settings-top">Settings</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <noscript>Brain Hub needs JavaScript turned on.</noscript>
  <script type="module" src="core/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))
    }
  </script>
</body>
</html>
