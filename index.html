<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Second line of defence for AI output (Nitpick H1): nothing may load from,
       or send to, any server except the app itself, the brain, OpenRouter and GitHub. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co https://openrouter.ai https://api.github.com https://raw.githubusercontent.com; manifest-src 'self'; worker-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Your personal command center for AI tools.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brain Hub">
  <title>Brain Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="core/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/home">Brain Hub</a>
    <nav class="topnav" aria-label="Main">
      <a href="#/home" data-nav="home" data-testid="nav-home">Home</a>
      <a href="#/settings" data-nav="settings" data-testid="nav-settings-top">Settings</a>
    </nav>
  </header>
  <main id="app" tabindex="-1"></main>
  <noscript>Brain Hub needs JavaScript turned on.</noscript>
  <script type="module" src="core/app.js"></script>
  <script src="core/sw-register.js"></script>
</body>
</html>
